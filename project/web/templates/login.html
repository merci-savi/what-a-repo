<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Вход — панель администратора</title>
	<link rel="stylesheet" href="/static/css/index.css"> <!-- базовая карточка и кнопка -->
	<link rel="stylesheet" href="/static/css/login.css"> <!-- ваш стиль полей ввода -->
	<link rel="stylesheet" href="/static/css/app.css">   <!-- статусы -->
</head>
<body>
	<main class="container">
		<header>
			<h1>Вход</h1>
			<p>Панель администратора: просмотр заявок и документов</p>
		</header>

		<!-- Отправку перехватит login.js и сделает POST /api/login -->
		<form id="login-form">
			<section class="section">
				<h2>Логин</h2>
				<input type="text" id="username" name="username"
					   placeholder="Логин" autocomplete="username" required>
			</section>
			<section class="section">
				<h2>Пароль</h2>
				<input type="password" id="password" name="password"
					   placeholder="Пароль" autocomplete="current-password" required>
			</section>
			<button class="submit-button" type="submit">Войти</button>
			<p class="status" id="status" role="status" aria-live="polite"></p>
		</form>

		<footer><a href="/">← Вернуться к форме отчёта</a></footer>
	</main>

	<script src="/static/js/login.js"></script>
</body>
</html>
