<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Вход — Расписание</title>
	<link rel="stylesheet" href="/static/css/index.css">
	<link rel="stylesheet" href="/static/css/login.css">
	<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
	<main class="container">
		<header>
			<h1>Вход</h1>
			<p>Студенты, преподаватели и администратор</p>
		</header>
		<form id="login-form">
			<section class="section">
				<h2>Логин</h2>
				<input type="text" id="username" placeholder="Логин" autocomplete="username" required>
			</section>
			<section class="section">
				<h2>Пароль</h2>
				<input type="password" id="password" placeholder="Пароль" autocomplete="current-password" required>
			</section>
			<button class="submit-button" type="submit">Войти</button>
			<p class="status" id="status" role="status" aria-live="polite"></p>
		</form>
		<footer>Студент без аккаунта? <a href="/register">Зарегистрироваться</a></footer>
	</main>
	<script src="/static/js/login.js"></script>
</body>
</html>
